<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7B8CFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C084FC;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer circle gradient -->
  <circle cx="128" cy="128" r="120" fill="url(#grad1)" opacity="0.95"/>

  <!-- Inner dark circle -->
  <circle cx="128" cy="128" r="115" fill="#0F0F1A"/>

  <!-- Accent ring -->
  <circle cx="128" cy="128" r="120" fill="none" stroke="url(#grad1)" stroke-width="2" opacity="0.4"/>

  <!-- SL Text -->
  <text x="128" y="145" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#00D4FF" text-anchor="middle" filter="url(#glow)">SL</text>
</svg>
